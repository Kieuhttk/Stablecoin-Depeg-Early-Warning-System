# Cấu hình pipeline Code 1, BẢN BACKUP KHÔNG ON-CHAIN (Nhóm 4, Stablecoin Depeg Early-Warning)
# Bản này dùng khi KHÔNG tải được bất kỳ dữ liệu on-chain/DEX nào (Curve, Dune, Uniswap...).
# Chỉ dùng nguồn thị trường (Yahoo Finance, Binance, CryptoCompare nếu có key) và proxy DefiLlama (supply, TVL).

sample:
  start: "2020-01-01"     # đề: các giai đoạn căng thẳng 2020–2026
  # Ngày cuối ĐÓNG BĂNG để panel tái lập được. Đặt = ngày UTC gần nhất mà Yahoo và DefiLlama đều có dữ liệu.
  # null => hôm qua (UTC): KHÔNG khuyến nghị vì panel đổi mỗi lần chạy.
  end: "2026-10-16"

# Số ngày làm trễ dữ liệu DefiLlama (supply, TVL). 1 = bảo thủ chống look-ahead (hàng t chỉ dùng giá trị gắn nhãn <= t-1).
llama_lag_days: 1
llama_ffill_limit: 3      # chỉ ffill tối đa 3 ngày, có cờ supply_ffilled

# CryptoCompare là TÙY CHỌN. Không có key => bỏ qua êm (status = skipped_no_key), đối chiếu chuyển sang Binance quy USD.
cryptocompare_api_key_env: CRYPTOCOMPARE_API_KEY

# Binance báo giá theo USDT. Pipeline quy về USD bằng giá đóng cửa USDT-USD (Yahoo) cùng ngày.
binance_usd_conversion: true

# Ngưỡng các cờ chất lượng
quality:
  src_disagree_threshold: 0.005   # lệch giá đóng cửa giữa Yahoo và nguồn độc lập > 0,5% => src_disagree
  hl_spike_threshold: 0.05        # High/Low lệch neo > 5% ...
  hl_body_threshold: 0.01         # ... trong khi open và close đều lệch < 1%, và nguồn độc lập không xác nhận
  hl_extreme_threshold: 0.25      #     hoặc râu > 25% => nghi "râu nến" lỗi (hl_suspect)

# role: core | extension | case_study (mục 3.1 của đề). binance_fallback: dùng Binance (quy USD) khi Yahoo và CryptoCompare đều thiếu.
coins:
  USDT:  {role: core,       type: fiat_backed,   yahoo: USDT-USD,  cc: USDT,  binance: null,       llama_symbol: USDT,  llama_name: Tether}
  USDC:  {role: core,       type: fiat_backed,   yahoo: USDC-USD,  cc: USDC,  binance: USDCUSDT,   llama_symbol: USDC,  llama_name: USD Coin,          binance_fallback: true}
  DAI:   {role: core,       type: crypto_backed, yahoo: DAI-USD,   cc: DAI,   binance: DAIUSDT,    llama_symbol: DAI,   llama_name: Dai,               binance_fallback: true}
  BUSD:  {role: extension,  type: fiat_backed,   yahoo: BUSD-USD,  cc: BUSD,  binance: BUSDUSDT,   llama_symbol: BUSD,  llama_name: Binance USD,       binance_fallback: true}
  FDUSD: {role: extension,  type: fiat_backed,   yahoo: FDUSD-USD, cc: FDUSD, binance: FDUSDUSDT,  llama_symbol: FDUSD, llama_name: First Digital USD, binance_fallback: true}
  UST:   {role: case_study, type: algorithmic,   yahoo: UST-USD,   cc: UST,   binance: USTUSDT,    llama_symbol: UST,   llama_name: TerraUSD, llama_alt: [terra], binance_fallback: true, last_valid_date: "2022-05-31"}

market:
  btc_yahoo: BTC-USD
  eth_yahoo: ETH-USD
  vol_window: 7
  warmup_days: 30         # tải BTC/ETH sớm hơn start 30 ngày để btc_vol không NaN ở đầu mẫu
